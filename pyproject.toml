[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symple"
version = "0.1.0"
description = "A minimal worksheet-style desktop front-end for SymPy with a Maple-inspired input language."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ales Toman" }]
requires-python = ">=3.10"
dependencies = [
    "sympy>=1.12",
    "PySide6>=6.5",
    "matplotlib>=3.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
symple = "symple.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
